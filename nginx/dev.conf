server {
    listen 80;
    server_name app-dev.15.206.80.178.nip.io;

    location / {
        proxy_pass http://localhost:5000;
    }
}

server {
    listen 80;
    server_name api-dev.15.206.80.178.nip.io;

    location / {
        proxy_pass http://localhost:3000;
    }
}

server {
    listen 80;
    server_name ws-dev.15.206.80.178.nip.io;

    location / {
        proxy_pass http://localhost:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}